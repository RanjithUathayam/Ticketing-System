<div class="po-wrapper fx-pending-po-scope" #root>
    <div class="po-container">
        <div class="masthead">
            <h1>Pending PO Generator</h1>
            <div class="tag">Operations</div>
            <div class="date" id="todayDate"></div>
        </div>

        <div class="panel">
            <h2>Upload SKU Spreadsheet</h2>
            <div class="drop" id="dropzonePO">
                <div class="icon">📊</div>
                <div class="main">Drop your SKU file here</div>
                <div class="sub">XLSX or CSV with SKU, Name, and Qty columns</div>
                <input type="file" id="fileInputPO" accept=".xlsx,.csv,.xls">
            </div>
            <div class="filename" id="filenamePO"></div>
            <div class="status-po" id="statusPO"></div>
        </div>

        <div class="panel">
            <h2 class="section-title">Statistics</h2>
            <div class="summary-grid">
                <div class="stat">
                    <div class="num" id="stat-skus">—</div>
                    <div class="lbl">SKUs</div>
                </div>
                <div class="stat">
                    <div class="num" id="stat-total">—</div>
                    <div class="lbl">Total Units</div>
                </div>
                <div class="stat">
                    <div class="num" id="stat-cod">—</div>
                    <div class="lbl">COD</div>
                </div>
                <div class="stat">
                    <div class="num" id="stat-prepaid">—</div>
                    <div class="lbl">Prepaid</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2 class="section-title">Categories</h2>
            <div id="catListContainer" class="cat-list"></div>
            <div id="othersBox" class="others-box">
                <div class="others-head" id="othersToggle">
                    <span class="others-flag">⚠️</span>
                    <b>Uncategorized Items</b>
                    <span class="others-chevron">›</span>
                </div>
                <div class="others-list" id="othersListBody"></div>
            </div>
        </div>

        <div class="panel">
            <h2 class="section-title">Custom Rules</h2>
            <table class="rules-table">
                <thead>
                    <tr>
                        <th>Keyword</th>
                        <th>Category</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="rulesTableBody"></tbody>
            </table>
        </div>

        <div class="actions" style="margin-top:30px;">
            <button class="btn-manifest" id="downloadBtnPO">Download Pending PO (.xlsx)</button>
        </div>
    </div>
</div>

<style>
    .fx-pending-po-scope {
        /* :root variables, folded in — Angular does not scope :root/html/body selectors */
        --primary: #1e293b;
        --primary-light: #334155;
        --accent-uathayan: #2563eb;
        --accent-ariser: #d97706;
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --border-color: #e2e8f0;
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --success: #16a34a;

        /* html, body reset, folded in */
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-dark);
        display: block;
    }

    .fx-pending-po-scope * { box-sizing: border-box; }

    .po-wrapper {
        background: #f6f4ee;
        padding: 32px 20px 60px;
        min-height: 100vh;
    }

    .po-container {
        max-width: 880px;
        margin: 0 auto;
        padding: 0;
    }

    .masthead {
        border-bottom: 3px solid #1c2521;
        padding-bottom: 16px;
        margin-bottom: 28px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 10px;
    }

    .masthead h1 {
        font-size: 26px;
        margin: 0;
        letter-spacing: 0.5px;
        font-weight: 800;
        color: #1c2521;
    }

    .masthead .tag {
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        color: #7e3216;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    .masthead .date {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        color: #5a5448;
    }

    /* Shared primitive — defined once in the hub for every app, used here by the four
       "panel" sections (upload, statistics, categories, custom rules). */
    .panel {
        background: #fffdf8;
        border: 1px solid #ded7c2;
        box-shadow: 0 1px 0 rgba(0,0,0,.03);
        padding: 22px;
        margin-bottom: 22px;
    }

    .panel h2 {
        margin: 0 0 14px;
        font-family: "Fraunces", "Iowan Old Style", Georgia, serif;
        font-size: 17px;
        font-weight: 700;
        color: #122437;
    }

    .drop {
        border: 2px dashed #d8d3c4;
        border-radius: 3px;
        padding: 36px 20px;
        text-align: center;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease;
    }

    .drop:hover, .drop.drag {
        border-color: #a8431f;
        background: #eef1e9;
    }

    .drop .icon { font-size: 30px; margin-bottom: 8px; }
    .drop .main { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .drop .sub { font-size: 12.5px; color: #79786d; }
    .drop input { display: none; }

    .filename {
        margin-top: 14px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        background: #eef1e9;
        border: 1px solid #5c6b4f;
        color: #5c6b4f;
        padding: 8px 12px;
        border-radius: 2px;
        display: none;
        word-break: break-all;
    }

    .status-po {
        margin-top: 14px;
        font-size: 13px;
        font-family: 'Courier New', Courier, monospace;
        display: none;
        padding: 10px 12px;
        border-radius: 2px;
    }

    .status-po.err { display: block; background: #fbe9e4; color: #7e3216; border: 1px solid #a8431f; }
    .status-po.ok { display: block; background: #eef1e9; color: #5c6b4f; border: 1px solid #5c6b4f; }

    h2.section-title {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #79786d;
        margin: 0 0 14px;
        font-weight: 700;
    }

    .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 1px;
        background: #d8d3c4;
        border: 1px solid #d8d3c4;
        margin-bottom: 20px;
    }

    .stat {
        background: #ffffff;
        padding: 16px 14px;
    }

    .stat .num { font-size: 24px; font-weight: 800; font-family: 'Courier New', Courier, monospace; }
    .stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #79786d; margin-top: 4px; }

    .cat-list {
        border: 1px solid #d8d3c4;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .cat-row {
        display: grid;
        grid-template-columns: 1fr 70px 70px 70px;
        gap: 0;
        padding: 10px 14px;
        font-size: 13px;
        border-bottom: 1px solid #d8d3c4;
        align-items: center;
    }

    .cat-row:last-child { border-bottom: none; }

    .cat-row.head {
        background: #1c2521;
        color: #f6f4ee;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .cat-row .name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .cat-row .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .cat-row span { text-align: right; font-family: 'Courier New', Courier, monospace; }

    .others-box {
        border: 1px solid #D4A017;
        background: #FCEFC7;
        border-radius: 2px;
        margin-bottom: 20px;
        overflow: hidden;
    }

    .others-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        cursor: pointer;
        font-size: 13px;
        color: #5a4509;
    }

    .others-flag { font-size: 15px; flex: none; }
    .others-head b { color: #8a6a0d; }

    .others-chevron {
        margin-left: auto;
        transition: transform .15s ease;
        flex: none;
        color: #8a6a0d;
    }

    .others-box.open .others-chevron { transform: rotate(90deg); }

    .others-list {
        display: none;
        border-top: 1px solid #D4A017;
        max-height: 260px;
        overflow-y: auto;
        background: #fffdf6;
    }

    .others-box.open .others-list { display: block; }

    .others-item {
        display: grid;
        grid-template-columns: 1fr 140px 80px;
        gap: 10px;
        padding: 8px 14px;
        font-size: 12.5px;
        border-bottom: 1px solid #f1e4b8;
    }

    .others-item:last-child { border-bottom: none; }

    .oi-name { color: #1c2521; }
    .oi-sku { font-family: 'Courier New', Courier, monospace; color: #79786d; }
    .oi-qty { text-align: right; font-family: 'Courier New', Courier, monospace; color: #8a6a0d; font-weight: 700; }

    .oi-assign {
        display: flex;
        gap: 6px;
        padding: 0 14px 10px;
        flex-wrap: wrap;
    }

    .oi-assign input {
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        padding: 6px 8px;
        border: 1px solid #e3d9a8;
        border-radius: 2px;
        background: #fff;
        color: #1c2521;
    }

    .oi-assign .oi-keyword { flex: 1 1 160px; min-width: 110px; }
    .oi-assign .oi-category { flex: 1 1 140px; min-width: 110px; }

    .oi-assign button {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 12px;
        border: none;
        border-radius: 2px;
        background: #8a6a0d;
        color: #fff;
        cursor: pointer;
        flex: none;
    }

    .oi-assign button:hover { background: #6d5309; }

    /* Shared generic table primitives — .rules-table has no dedicated rule of its own,
       it just inherits these (used by the Custom Rules table). */
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 13px;
    }

    th {
        background-color: #f1f5f9;
        color: var(--primary-light);
        font-weight: 600;
        padding: 12px 16px;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--border-color);
    }

    td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
        color: #334155;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8fafc; }

    /* Shared primitives — .actions / .btn-manifest are defined once in the hub and reused
       by this app's download button. */
    .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
        flex-wrap: wrap;
    }

    .btn-manifest {
        font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: .03em;
        text-transform: uppercase;
        padding: 11px 18px;
        border: 1.5px solid #1e3a5f;
        background: #1e3a5f;
        color: #f6f3ea;
        cursor: pointer;
        transition: background .12s ease, transform .05s ease;
    }

    .btn-manifest:hover { background: #122437; }
    .btn-manifest:active { transform: translateY(1px); }
    .btn-manifest.secondary {
        background: transparent;
        color: #1e3a5f;
    }

    .btn-manifest.secondary:hover { background: #eef2f6; }
    .btn-manifest:disabled { opacity: .4; cursor: not-allowed; }
</style>
